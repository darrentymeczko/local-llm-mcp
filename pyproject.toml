[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-mcp"
version = "0.2.0"
description = "MCP server that delegates small, bounded coding subtasks to a local OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "llm", "local-llm", "claude-code", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "mcp>=2.1",
    "httpx>=0.27",
]

[project.scripts]
local-llm-mcp = "local_llm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm_mcp"]
